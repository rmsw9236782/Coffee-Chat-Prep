name: Coffee Chat Prep

on:
  schedule:
    # GitHub uses UTC. 01:00 UTC = 8 PM Eastern (Nov-Mar), 9 PM after daylight saving starts.
    - cron: "0 1 * * *"
  workflow_dispatch:          # adds a "Run workflow" button for live demos
    inputs:
      mode:
        description: "Run as the agent or the fixed workflow"
        type: choice
        options: [agent, workflow]
        default: agent

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCHOOL_DOMAIN: cornell.edu
          MODE: ${{ inputs.mode || 'agent' }}
